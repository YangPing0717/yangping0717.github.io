<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>商業空間｜效果預覽</title>
  <style>
    :root{color-scheme:dark;--bg:#071322;--card:#0c1d30;--line:#29445d;--cyan:#56e7df;--muted:#a9b9c8}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:#f4f8fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
    main{max-width:1400px;margin:auto;padding:44px 32px 80px} h1{margin:0 0 8px;font-size:32px} .intro{margin:0 0 30px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px}
    article{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--card)}
    img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover} .info{padding:16px 18px 18px}
    h2{margin:0 0 6px;font-size:20px}.info p{margin:0;color:var(--cyan);font-size:13px}
    @media(max-width:800px){main{padding:28px 16px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <h1>商業空間｜缺漏 7 筆效果預覽</h1>
  <p class="intro">依 CASE_IMAGE_STYLE_GUIDE.md 處理；目前供確認，尚未加入 case.html。</p>
  <div class="grid">
    <article><img src="01_桃園哈雷旗艦展示中心.png" alt="桃園哈雷旗艦展示中心"><div class="info"><h2>01 桃園哈雷旗艦展示中心</h2><p>低彩灰藍綠｜品牌識別保留｜科技 UI</p></div></article>
    <article><img src="02_天母木石研.png" alt="天母木石研"><div class="info"><h2>02 天母木石研</h2><p>實景格局保留｜亮度與中間調提升</p></div></article>
    <article><img src="03_定泰臻翫銷售中心樣品屋.png" alt="定泰臻翫銷售中心樣品屋"><div class="info"><h2>03 定泰臻翫銷售中心樣品屋</h2><p>橫式構圖｜智慧住宅介面</p></div></article>
    <article><img src="04_上城若水銷售中心.png" alt="上城若水銷售中心"><div class="info"><h2>04 上城若水銷售中心</h2><p>垂直水平校正｜低彩灰藍綠</p></div></article>
    <article><img src="05_CLOVER_BELLAVITA.png" alt="CLOVER BELLAVITA"><div class="info"><h2>05 CLOVER BELLAVITA</h2><p>空間材質保留｜數位元素收斂</p></div></article>
    <article><img src="06_勞瑞斯牛肋排餐廳.png" alt="勞瑞斯牛肋排餐廳"><div class="info"><h2>06 勞瑞斯牛肋排餐廳</h2><p>古典實景保留｜環境管理 UI</p></div></article>
    <article><img src="07_鼎泰豐101店.png" alt="鼎泰豐101店"><div class="info"><h2>07 鼎泰豐 101 店</h2><p>品牌紅識別保留｜來源浮水印移除</p></div></article>
  </div>
</main></body></html>
